name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OpenH264 (via PixelImage) is built by a native GNU Makefile that needs
      # GCC/Clang + mingw32-make + sh, so Windows CI must use the MinGW
      # toolchain. MSVC cannot build this project.
      - name: Setup MSYS2 (MinGW)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            make

      # ---------------------------------------------------------------- Linux
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --timeout 900

      # -------------------------------------------------------------- Windows
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . --preset gnu_release

      # Build OpenH264 manually inside the POSIX MSYS2 shell, reproducing the
      # output of PixelImage's OpenH264.cmake custom command. The custom
      # command's Windows-style spawn chain
      # (`cd /d ... && cmake -E env PATH=... mingw32-make.exe ...`)
      # fails silently on CI runners but works locally; with the output file
      # pre-created (and the settings stamp unchanged), CMake's cmake --build
      # never runs it at all. This is the officially documented MSYS2 way to
      # build OpenH264.
      - name: Pre-build OpenH264 (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          make --version 2>&1 | head -1
          /mingw64/bin/cc.exe --version 2>&1 | head -1
          /mingw64/bin/nasm.exe --version 2>&1 | head -1
          cd build/gnu_release/_deps/openh264-src
          rm -f libopenh264.a
          make -j"$(nproc)" OS=mingw_nt ARCH=x86_64 BUILDTYPE=Release USE_ASM=Yes \
            CC=/mingw64/bin/cc.exe CXX=/mingw64/bin/c++.exe AR=/mingw64/bin/ar.exe \
            libopenh264.a
          cp -f libopenh264.a ../openh264-build/openh264-install/lib/libopenh264.a

      # mingw32-make runs CMake's cmd-style recipes (cd /d ...) through POSIX
      # sh.exe whenever any sh.exe is on PATH (MSYS2 usr/bin, Git for Windows,
      # ...). Use a whitelisted PATH containing only mingw64/bin and the core
      # Windows directories, mirroring the local gnu_release preset environment.
      # The MSYS2 usr/bin paths needed by the inner OpenH264 make were already
      # baked into the generated build at configure time.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          $env:Path = "$mingw;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          where.exe sh   # expected: "Could not find files for the given pattern(s)."
          cmake --build build/gnu_release -j

      # MinGW-built exes need libstdc++-6.dll etc. from mingw64/bin.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          $env:Path = "$mingw;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          ctest --test-dir build/gnu_release --output-on-failure --timeout 900