name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OpenH264 (via PixelImage) is built by a native GNU Makefile that needs
      # GCC/Clang + mingw32-make + sh, so Windows CI must use the MinGW
      # toolchain. MSVC cannot build this project.
      - name: Setup MSYS2 (MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            make

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . --preset gnu_release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # mingw32-make auto-runs CMake's cmd-style recipes (cd /d ...) through
          # POSIX sh.exe when sh is on PATH (setup-msys2 adds usr/bin). Keep
          # usr/bin off PATH, like the local gnu_release preset environment.
          $env:Path = ((($env:Path -split ';') | Where-Object { $_ -notmatch '[\\/]msys64[\\/]usr[\\/]bin' }) -join ';')
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          cmake --build build/gnu_release -j

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --timeout 900

      # MinGW-built exes need libstdc++-6.dll etc. from mingw64/bin.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:Path = ((($env:Path -split ';') | Where-Object { $_ -notmatch '[\\/]msys64[\\/]usr[\\/]bin' }) -join ';')
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          ctest --test-dir build/gnu_release --output-on-failure --timeout 900
